<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="base" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0%" stop-color="#12141c"/>
      <stop offset="55%" stop-color="#0c0d13"/>
      <stop offset="100%" stop-color="#08080c"/>
    </linearGradient>
    <radialGradient id="glowA" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2b3f66" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#2b3f66" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#4a3358" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#4a3358" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowC" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1c3a44" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#1c3a44" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="90"/>
    </filter>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
  </defs>

  <rect width="1920" height="1080" fill="url(#base)"/>

  <g filter="url(#soft)">
    <ellipse cx="360" cy="220" rx="520" ry="380" fill="url(#glowA)"/>
    <ellipse cx="1560" cy="300" rx="460" ry="360" fill="url(#glowB)"/>
    <ellipse cx="980" cy="1010" rx="760" ry="380" fill="url(#glowC)"/>
  </g>

  <rect width="1920" height="1080" filter="url(#grain)" opacity="0.05"/>
  <rect width="1920" height="1080" fill="#000000" opacity="0.22"/>
</svg>
